<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTE 多专家协同审核系统</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/workbench.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/logo.svg" alt="" class="brand-logo">
      <div>
        <div class="brand-name">VTE Review</div>
        <div class="brand-sub">循证 · 协作 · 决策</div>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <div class="nav-caption">工作空间</div>
      <a href="#/" data-nav="dashboard"><i data-icon="grid"></i><span>工作台</span></a>
      <a href="#/new" data-nav="new"><i data-icon="plus"></i><span>新建审核</span></a>
      <a href="#/history" data-nav="history"><i data-icon="folder"></i><span>审核记录</span></a>
      <div class="nav-caption secondary">工具与配置</div>
      <a href="#/settings" data-nav="settings"><i data-icon="settings"></i><span>模型与设置</span></a>
      <a href="#/guide" data-nav="guide"><i data-icon="book"></i><span>使用指南</span></a>
    </nav>
    <div class="sidebar-note"><i data-icon="shield"></i><b>每一份判断，都有迹可循</b><p>从证据检索到定向复核，<br>完整保留协作与修订过程。</p></div>
    <div class="sidebar-foot">
      <div class="live-dot" id="server-state"><span></span>本地服务运行中</div>
      <div class="muted small" id="app-version"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <div class="global-search"><i data-icon="search"></i><input aria-label="搜索审核记录" placeholder="搜索病例或审核记录" data-key="global-search"><kbd>↵</kbd></div>
        <span class="workspace-label">研究工作台</span><div class="profile-mark" title="本地工作空间">V</div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="详情" aria-modal="true" aria-hidden="true" inert></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
