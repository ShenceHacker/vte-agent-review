<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTE Anticoagulation Assistant</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/workspace.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/logo.svg" alt="" class="brand-logo">
      <div>
        <div class="brand-name">VTE<span class="brand-line">Anticoagulation</span><span class="brand-line">Assistant</span></div>
      </div>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-caption">WORKSPACE</div>
      <a href="#/" data-nav="dashboard"><i data-icon="grid"></i><span>Overview</span></a>
      <a href="#/new" data-nav="new"><i data-icon="plus"></i><span class="nav-label" data-short="New plan">New recommendation</span></a>
      <a href="#/history" data-nav="history"><i data-icon="folder"></i><span class="nav-label" data-short="Plans">Recommendations</span></a>
      <a href="#/patients" data-nav="patients"><i data-icon="users"></i><span>Patients</span></a>
      <a href="#/knowledge" data-nav="knowledge"><i data-icon="book"></i><span>Knowledge base</span></a>
      <div class="nav-caption secondary">TOOLS</div>
      <a href="#/settings" data-nav="settings"><i data-icon="settings"></i><span>Settings</span></a>
      <a href="#/guide" data-nav="guide"><i data-icon="book"></i><span>Quick start</span></a>
    </nav>
    <div class="sidebar-foot">
      <div class="live-dot" id="server-state"><span></span>Local service online</div>
      <div class="muted small" id="app-version"></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <div class="global-search"><i data-icon="search"></i><input aria-label="Search recommendations" placeholder="Search recommendations" data-key="global-search"><kbd>↵</kbd></div>
        <div class="profile-mark" title="Local workspace">V</div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Details" aria-modal="true" aria-hidden="true" inert></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
