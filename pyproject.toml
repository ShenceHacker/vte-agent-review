[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vte-agent-review"
version = "0.1.0"
description = "Parallel specialist review and targeted revision loops for VTE research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]

[project.scripts]
vte-review = "vte_review.cli:main"

[tool.setuptools.packages.find]
include = ["vte_review*"]
