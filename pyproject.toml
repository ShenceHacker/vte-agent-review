[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vte-agent-review"
version = "0.4.0"
description = "Parallel specialist review and targeted revision loops for VTE research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
pdf = ["pypdf>=6,<7"]
images = ["Pillow>=11,<13"]

[project.scripts]
vte-review = "vte_review.cli:main"

[tool.setuptools.packages.find]
include = ["vte_review*"]

[tool.setuptools.package-data]
vte_review = ["web/*"]
